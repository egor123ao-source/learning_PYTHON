<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6f2">
    <title>Страница не найдена — Код</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2923; background: #f4f7f5; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 440px); padding: 32px 24px; border: 1px solid #e5ebe7; border-radius: 22px; background: #fff; text-align: center; }
      .mark { display: inline-grid; width: 44px; height: 44px; margin-bottom: 16px; place-items: center; border-radius: 14px; color: #fff; background: #197653; font-size: 15px; font-weight: 800; }
      h1 { margin: 0 0 8px; font-size: 26px; }
      p { margin: 0; color: #78847d; line-height: 1.6; }
      a { display: inline-flex; min-height: 46px; margin-top: 22px; padding: 0 18px; align-items: center; justify-content: center; border-radius: 13px; color: #fff; background: #197653; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #83c9a8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">&lt;/&gt;</span>
      <h1>Страница не найдена</h1>
      <p>Похоже, такой страницы нет. Вернись к курсу Python и продолжай учиться.</p>
      <a href="/">На главную</a>
    </main>
  </body>
</html>
